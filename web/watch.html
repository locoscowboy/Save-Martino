<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save Martino · watch</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c1419; color: #ecf1ee; font-family: system-ui, sans-serif; overflow: hidden; }
  #game { width: 100%; height: 100%; display: grid; place-content: center; }
  #grid { display: grid; width: 100%; height: 100%; gap: 4px; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; background: #0c1419; }
  #grid iframe { width: 100%; height: 100%; border: 0; background: #111a1f; }
  #grid .label { position: absolute; }
  .cell { position: relative; } .cell b { position: absolute; left: 8px; top: 6px; font-size: 14px; text-transform: capitalize; background: #0008; padding: 2px 8px; border-radius: 4px; }
  #help { position: fixed; right: 10px; bottom: 8px; font-size: 12px; color: #9fb1b6; }
</style>
</head>
<body>
<div id="game"></div>
<div id="help"></div>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script src="js/config.js"></script>
<script src="js/renderer.js"></script>
<script>
(function () {
  const qs = new URLSearchParams(location.search);
  const room = (qs.get('room') || 'bacaro').toLowerCase();
  const mini = qs.get('mini') === '1';
  const base = window.SERVER_URL || location.origin;

  if (room === 'all') {
    // TV grid: one small watch page per room, all live. Press a number key to go full-screen on one room, 0 to come back.
    const grid = document.createElement('div'); grid.id = 'grid'; document.getElementById('game').replaceWith(grid);
    const rooms = window.ROOMS;
    rooms.forEach((r) => { const c = document.createElement('div'); c.className = 'cell'; c.innerHTML = `<iframe src="watch.html?room=${r}&mini=1"></iframe><b>${r}</b>`; grid.appendChild(c); });
    document.getElementById('help').textContent = 'Keys 1-5: one room full-screen · 0: grid';
    addEventListener('keydown', e => {
      const n = +e.key;
      if (n >= 1 && n <= rooms.length) location.href = `watch.html?room=${rooms[n - 1]}&back=all`;
    });
    return;
  }

  const socket = io(base, { transports: ['websocket', 'polling'] });
  socket.on('connect', () => socket.emit('watch', { room }));
  const game = SaveMartino.createRenderer(document.getElementById('game'), { room, mini, base, onStart: () => socket.emit('start') });
  socket.on('state', s => game.push(s));
  addEventListener('keydown', e => { if (e.key === '0' && qs.get('back') === 'all') location.href = 'watch.html?room=all'; if (e.key === 'Enter') socket.emit('start'); });
  if (!mini) document.getElementById('help').textContent = 'Enter: start the run' + (qs.get('back') ? ' · 0: back to the grid' : '');
})();
</script>
</body>
</html>
