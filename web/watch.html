<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rescue Martino · watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Silkscreen:wght@400;700&display=swap">
<link rel="stylesheet" href="css/ui.css">
<style>
  html, body { margin: 0; height: 100%; background: #0c1419; color: #ecf1ee; font-family: system-ui, sans-serif; overflow: hidden; }
  #game { width: 100%; height: 100%; display: grid; place-content: center; }
  #grid { display: grid; width: 100%; height: 100%; gap: 4px; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; background: #0c1419; }
  #grid iframe { width: 100%; height: 100%; border: 0; background: #111a1f; }
  .cell { position: relative; } .cell b { position: absolute; left: 8px; top: 6px; font-size: 14px; letter-spacing: 0.15em; background: #0008; padding: 2px 8px; border-radius: 4px; }
  #help { position: fixed; right: 10px; top: 6px; font-size: 11px; color: #fffa; z-index: 40; text-shadow: 0 1px 0 #000; }
  .hint { color: #9fb1b6; font-size: 0.95rem; max-width: 46ch; }
  /* room picker */
  #picker { height: 100%; display: none; place-content: center; gap: 16px; text-align: center; padding: 24px; }
  #picker.on { display: grid; }
  #picker h1 { margin: 0; }
  .rooms { display: grid; gap: 8px; width: min(90vw, 420px); }
  .rooms button, #picker input { font: inherit; font-size: 1.1rem; padding: 12px; border-radius: 8px; border: 1px solid #2e3e47; background: #1a252c; color: inherit; width: 100%; cursor: pointer; text-align: left; }
  .rooms button b { letter-spacing: 0.2em; margin-right: 12px; color: #d9a030; } .rooms button small { color: #9fb1b6; }
  #pickCode { text-transform: uppercase; letter-spacing: 0.3em; text-align: center; font-weight: 700; }
</style>
</head>
<body>
<div id="picker">
  <h1>Rescue Martino</h1>
  <div class="hint">Which team is this screen for? Host a game on a phone first, then pick it here.</div>
  <div class="rooms" id="pickRooms"><div class="hint">No game yet.</div></div>
  <input id="pickCode" type="text" placeholder="or type the code" maxlength="4" autocapitalize="characters" spellcheck="false">
  <div class="hint">TV: <a href="#" id="tvLink" style="color:#3db5b0">all rooms in a grid</a></div>
</div>
<div id="game"></div>

<div id="help"></div>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="js/config.js"></script>
<script src="js/renderer.js"></script>
<script src="js/ui.js"></script>
<script src="js/screens.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const room = (qs.get('room') || '').toUpperCase();
  const mini = qs.get('mini') === '1';
  const base = window.SERVER, sqs = window.SERVER_QS;
  const pageUrl = (page, params) => location.origin + location.pathname.replace(/[^/]*$/, page) + '?' + params + sqs;
  const socket = io(base, { transports: ['websocket', 'polling'] });
  if (mini) document.body.classList.add('mini');
  setInterval(() => fetch(base + '/health').catch(() => {}), 5 * 60 * 1000); // a plain request now and then keeps a free Render instance awake

  // ---------- picker: no room in the URL ----------
  if (!room) {
    $('picker').classList.add('on'); $('game').style.display = 'none';
    $('tvLink').href = pageUrl('watch.html', 'room=all');
    socket.on('connect', () => socket.emit('watch', { room: 'all' }));
    socket.on('rooms', list => {
      const host = $('pickRooms');
      host.innerHTML = list.length ? '' : '<div class="hint">No game yet.</div>';
      for (const r of list) {
        const b = document.createElement('button');
        b.innerHTML = `<b>${r.code}</b>${r.players.map(p => p.name).join(', ') || '<small>empty</small>'} <small>· ${r.phase}</small>`;
        b.addEventListener('click', () => { location.href = pageUrl('watch.html', 'room=' + r.code); });
        host.appendChild(b);
      }
    });
    $('pickCode').addEventListener('keydown', e => { if (e.key === 'Enter' && $('pickCode').value.trim().length >= 4) location.href = pageUrl('watch.html', 'room=' + $('pickCode').value.trim().toUpperCase()); });
    return;
  }

  // ---------- TV grid: every live room, one small watch page each ----------
  if (room === 'ALL') {
    const grid = document.createElement('div'); grid.id = 'grid'; $('game').replaceWith(grid);
    let codes = [];
    socket.on('connect', () => socket.emit('watch', { room: 'all' }));
    socket.on('rooms', list => {
      const next = list.map(r => r.code);
      if (next.join() === codes.join()) return;
      codes = next; grid.innerHTML = '';
      if (!codes.length) { grid.innerHTML = `<div class="hint" style="place-self:center">No game yet. Phones: ${pageUrl('phone.html', '')}</div>`; return; }
      grid.style.gridTemplateColumns = `repeat(${codes.length <= 1 ? 1 : codes.length <= 4 ? 2 : 3}, 1fr)`;
      codes.forEach((c, i) => { const cell = document.createElement('div'); cell.className = 'cell'; cell.innerHTML = `<iframe src="${pageUrl('watch.html', 'room=' + c + '&mini=1')}"></iframe><b>${i + 1} · ${c}</b>`; grid.appendChild(cell); });
    });
    $('help').textContent = 'Keys 1-9: one room full-screen · 0: grid';
    addEventListener('keydown', e => { const n = +e.key; if (n >= 1 && n <= codes.length) location.href = pageUrl('watch.html', 'room=' + codes[n - 1] + '&back=all'); });
    return;
  }

  // ---------- one room ----------
  socket.on('connect', () => socket.emit('watch', { room }));
  socket.on('fail', () => { location.href = pageUrl('watch.html', ''); }); // no such game: back to the picker
  // sound on the team laptop only: five grid cells playing at once would be noise. The browser needs one click or key first.
  let game = null; const help = 'Enter: start the run' + (qs.get('back') ? ' · 0: back to the grid' : '');
  if (!mini) $('help').textContent = help + ' · 🔇 click or press a key for sound';
  const manifest = (file) => fetch(base + '/content/' + file).then(r => r.json()).catch(() => null);
  Promise.all([manifest('sfx.json'), manifest('music.json')]).then(([sfx, music]) => {
    game = SaveMartino.createRenderer($('game'), { room, mini, base, sfx, music, sound: !mini && !!(sfx || music), onSound: () => { $('help').textContent = help + ' · 🔊'; } });
  });
  const phoneUrl = pageUrl('phone.html', 'room=' + room);
  const screens = RMScreens.create(document.body, { mini, phoneUrl });
  socket.on('state', s => { if (game) game.push(s); screens.update(s); });
  (function loop() { screens.tick(); requestAnimationFrame(loop); })();
  addEventListener('keydown', e => { if (e.key === '0' && qs.get('back') === 'all') location.href = pageUrl('watch.html', 'room=all'); if (e.key === 'Enter') socket.emit('start'); });

  function fmt(sec) { const m = Math.floor(sec / 60), s = Math.floor(sec % 60); return `${m}:${String(s).padStart(2, '0')}`; }
})();
</script>
</body>
</html>
