<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Save Martino · controller</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111a1f; color: #ecf1ee; font-family: system-ui, sans-serif; touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  .screen { height: 100%; display: none; place-content: center; gap: 14px; padding: 20px; text-align: center; overflow-y: auto; touch-action: pan-y; }
  .screen.on { display: grid; }
  h1 { margin: 0; font-size: 1.8rem; }
  input, button { font: inherit; font-size: 1.1rem; padding: 12px; border-radius: 8px; border: 1px solid #2e3e47; background: #1a252c; color: inherit; width: min(80vw, 320px); margin: 0 auto; }
  button { font-weight: 700; } button:disabled { opacity: 0.4; }
  button.primary { background: #d23a2c; border-color: #d23a2c; } button.ok { background: #2e8b57; border-color: #2e8b57; } button.gold { background: #d9a030; border-color: #d9a030; color: #1a0d0b; }
  .chars { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; width: min(90vw, 420px); margin: 0 auto; }
  .char { padding: 10px; border-radius: 8px; border: 2px solid #2e3e47; background: #1a252c; cursor: pointer; display: grid; gap: 2px; text-align: left; }
  .char.sel { border-color: #3db5b0; } .char b { font-size: 1rem; } .char small { color: #9fb1b6; font-size: 0.75rem; }
  .modes { display: grid; gap: 8px; }
  #joinBox { display: grid; gap: 8px; } #joinBox[hidden] { display: none; }
  #code { text-transform: uppercase; letter-spacing: 0.3em; text-align: center; font-weight: 700; }
  .err { color: #f05a4c; min-height: 1.2em; font-size: 0.95rem; }
  .bigcode { font-size: 3rem; font-weight: 900; letter-spacing: 0.25em; color: #d9a030; line-height: 1; }
  .hint { color: #9fb1b6; font-size: 0.9rem; max-width: 40ch; margin: 0 auto; }
  ul.roster { list-style: none; margin: 0 auto; padding: 0; display: grid; gap: 6px; width: min(80vw, 320px); }
  ul.roster li { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 8px; background: #1a252c; border: 1px solid #2e3e47; }
  ul.roster li.ready { border-color: #2e8b57; } ul.roster li small { color: #9fb1b6; } ul.roster li .tick { color: #2e8b57; font-weight: 900; }
  #pad { position: relative; padding: 0; }
  #hud { position: absolute; top: 10px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 16px; font-weight: 700; }
  #hud .hearts { color: #f05a4c; letter-spacing: 2px; }
  #stick { position: absolute; left: 6vw; bottom: 10vh; width: 42vw; max-width: 260px; aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.15); }
  #knob { position: absolute; left: 50%; top: 50%; width: 38%; aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,0.25); transform: translate(-50%, -50%); }
  .btn { position: absolute; width: 22vw; max-width: 130px; aspect-ratio: 1; border-radius: 50%; display: grid; place-content: center; font-weight: 900; font-size: 1.2rem; border: 3px solid; }
  .btn:active, .btn.on { filter: brightness(1.4); }
  #atk { right: 24vw; bottom: 8vh; background: #d23a2c33; border-color: #d23a2c; }
  #spc { right: 4vw; bottom: 22vh; background: #3db5b033; border-color: #3db5b0; }
  #spc.cd { opacity: 0.35; }
  #msg { position: absolute; left: 0; right: 0; top: 40%; text-align: center; color: #9fb1b6; font-size: 0.95rem; padding: 0 16px; }
  #rot { display: none; position: fixed; inset: 0; background: #111a1f; place-content: center; text-align: center; z-index: 5; }
  @media (orientation: portrait) { #pad.live ~ #rot { display: grid; } }
</style>
</head>
<body>
<div id="join" class="screen on">
  <h1>Save Martino</h1>
  <input id="name" type="text" placeholder="Your name" maxlength="16" autocomplete="off">
  <div class="chars" id="chars"></div>
  <div class="modes">
    <button id="solo" type="button">Play solo</button>
    <button id="hostBtn" type="button" class="primary">Host a game</button>
    <button id="joinBtn" type="button">Join a game</button>
  </div>
  <div id="joinBox" hidden>
    <input id="code" type="text" placeholder="CODE" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button id="go" type="button" class="primary">Join</button>
  </div>
  <div id="joinErr" class="err"></div>
</div>

<div id="lobby" class="screen">
  <div class="hint">Your team's code</div>
  <div class="bigcode" id="lobbyCode"></div>
  <div class="hint" id="lobbyHint"></div>
  <ul class="roster" id="roster"></ul>
  <button id="readyBtn" type="button" class="ok">I'm ready</button>
  <button id="startBtn" type="button" class="gold" hidden>Start the run</button>
  <div id="lobbyMsg" class="hint"></div>
</div>

<div id="pad" class="screen">
  <div id="hud"><span id="who"></span><span class="hearts" id="hearts"></span></div>
  <div id="msg"></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="atk" class="btn">ATK</div>
  <div id="spc" class="btn">SP</div>
</div>
<div id="rot"><div>Turn your phone sideways</div></div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="js/config.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const base = window.SERVER;
  let roster = [], char = null, socket = null, myId = null, code = null, name = 'Player', pending = null;

  fetch(base + '/content/roster.json').then(r => r.json()).then(list => {
    roster = list; const host = $('chars');
    list.filter(c => !c.backup).forEach((c, i) => { // backup characters wait until their mechanic exists on the server
      const d = document.createElement('div'); d.className = 'char' + (i === 0 ? ' sel' : ''); if (i === 0) char = c.id;
      d.innerHTML = `<b>${c.name}</b><small>${c.label || ''}</small><small>${c.special.split(':')[0]}</small>`;
      d.addEventListener('click', () => { document.querySelectorAll('.char').forEach(x => x.classList.remove('sel')); d.classList.add('sel'); char = c.id; });
      host.appendChild(d);
    });
  }).catch(() => { $('joinErr').textContent = 'Cannot reach the game server.'; });

  try { const n = localStorage.getItem('sm-name'); if (n) $('name').value = n; } catch (e) {}
  if (qs.get('room')) { $('code').value = qs.get('room').toUpperCase(); $('joinBox').hidden = false; }

  function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); $('pad').classList.toggle('live', id === 'pad'); }

  // One socket for the whole session. A dropped connection rejoins the same game on reconnect.
  function connect(then) {
    name = $('name').value.trim() || 'Player';
    try { localStorage.setItem('sm-name', name); } catch (e) {}
    $('joinErr').textContent = '';
    if (socket && socket.connected) return then();
    pending = then;
    if (socket) return;
    socket = io(base, { transports: ['websocket', 'polling'] });
    socket.on('connect', () => { if (code) socket.emit('join', { room: code, name, char }); else if (pending) { pending(); pending = null; } });
    socket.on('joined', ({ id, room }) => { myId = id; code = room; $('lobbyCode').textContent = room; });
    socket.on('fail', ({ message }) => { $('joinErr').textContent = message; code = null; myId = null; show('join'); });
    socket.on('state', onState);
    socket.on('hit', () => { try { navigator.vibrate && navigator.vibrate(80); } catch (e) {} });
    socket.on('connect_error', () => { $('joinErr').textContent = 'Cannot connect to the game server.'; });
    socket.on('disconnect', () => { $('msg').textContent = 'Connection lost, reconnecting…'; $('lobbyMsg').textContent = 'Connection lost, reconnecting…'; });
  }
  $('solo').addEventListener('click', () => connect(() => socket.emit('solo', { name, char })));
  $('hostBtn').addEventListener('click', () => connect(() => socket.emit('host', { name, char })));
  $('joinBtn').addEventListener('click', () => { $('joinBox').hidden = false; $('code').focus(); });
  $('go').addEventListener('click', () => {
    const c = $('code').value.trim().toUpperCase();
    if (c.length < 4) { $('joinErr').textContent = 'Enter the 4-letter code.'; return; }
    connect(() => socket.emit('join', { room: c, name, char }));
  });
  $('code').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
  $('readyBtn').addEventListener('click', () => { if (socket && lastMe) socket.emit('ready', { ready: !lastMe.ready }); });
  $('startBtn').addEventListener('click', () => socket && socket.emit('start'));

  // ---------- input ----------
  const input = { dx: 0, dy: 0, attack: false, special: false };
  let dirty = true;
  const stick = $('stick'), knob = $('knob');
  let stickId = null;
  function setStick(e) {
    const r = stick.getBoundingClientRect(); const cx = r.left + r.width / 2, cy = r.top + r.height / 2; const rad = r.width / 2;
    let dx = (e.clientX - cx) / rad, dy = (e.clientY - cy) / rad; const len = Math.hypot(dx, dy); if (len > 1) { dx /= len; dy /= len; }
    const dead = 0.15; input.dx = Math.abs(dx) < dead ? 0 : dx; input.dy = Math.abs(dy) < dead ? 0 : dy;
    knob.style.transform = `translate(calc(-50% + ${dx * rad * 0.6}px), calc(-50% + ${dy * rad * 0.6}px))`; dirty = true;
  }
  stick.addEventListener('pointerdown', e => { stickId = e.pointerId; stick.setPointerCapture(e.pointerId); setStick(e); });
  stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) setStick(e); });
  const endStick = e => { if (e.pointerId === stickId) { stickId = null; input.dx = 0; input.dy = 0; knob.style.transform = 'translate(-50%, -50%)'; dirty = true; } };
  stick.addEventListener('pointerup', endStick); stick.addEventListener('pointercancel', endStick);
  const bind = (id, key) => { const el = $(id);
    el.addEventListener('pointerdown', e => { e.preventDefault(); input[key] = true; el.classList.add('on'); dirty = true; });
    const up = () => { input[key] = false; el.classList.remove('on'); dirty = true; };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('pointerleave', up); };
  bind('atk', 'attack'); bind('spc', 'special');
  // keyboard, for testing on a laptop
  const keys = {};
  addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; keys[e.key] = true; kb(); }); addEventListener('keyup', e => { keys[e.key] = false; kb(); });
  function kb() { input.dx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0); input.dy = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0); input.attack = !!(keys[' '] || keys.j); input.special = !!(keys.k || keys.Shift); dirty = true; }
  setInterval(() => { if (socket && myId && dirty) { socket.emit('input', input); dirty = false; } }, 50);
  setInterval(() => { dirty = true; }, 250); // keepalive so a dropped packet never sticks a direction

  // ---------- screens ----------
  let lastMe = null;
  const charName = (id) => (roster.find(c => c.id === id) || {}).name || id;
  function onState(s) {
    const me = s.players[myId]; if (!me) return;
    lastMe = me;
    if (s.phase === 'lobby' || s.phase === 'results') { renderLobby(s, me); show('lobby'); }
    else { renderPad(s, me); show('pad'); }
  }
  function renderLobby(s, me) {
    const ps = Object.entries(s.players), isHost = s.host === myId;
    $('lobbyHint').textContent = ps.length < s.maxPlayers ? `Teammates join with this code · ${ps.length}/${s.maxPlayers} in` : 'Team complete';
    $('roster').innerHTML = ps.map(([id, p]) => `<li class="${p.ready ? 'ready' : ''}"><span>${p.name}${id === s.host ? ' <small>host</small>' : ''}</span><span><small>${charName(p.char)}</small> <span class="tick">${p.ready ? '✓' : ''}</span></span></li>`).join('');
    $('readyBtn').textContent = me.ready ? 'Ready ✓ (tap to undo)' : "I'm ready";
    $('readyBtn').classList.toggle('ok', !me.ready);
    $('startBtn').hidden = !isHost; $('startBtn').disabled = !s.canStart;
    const waiting = ps.filter(([, p]) => !p.ready).length;
    const hostName = (s.players[s.host] || {}).name || 'the host';
    $('lobbyMsg').textContent = s.phase === 'results' && s.result
      ? `Martino saved in ${s.result.time}s · ${s.result.deaths} deaths · ${s.result.wipes} wipes · MVP ${s.result.mvp}. Ready for another run?`
      : waiting ? `Waiting for ${waiting} player${waiting > 1 ? 's' : ''} to be ready` : isHost ? 'Everyone is ready. Start when you like.' : `Everyone is ready. ${hostName} starts the run.`;
  }
  function renderPad(s, me) {
    $('who').textContent = me.name;
    $('hearts').textContent = '♥'.repeat(Math.max(0, me.hp)) + '♡'.repeat(Math.max(0, (s.maxHp || 5) - me.hp));
    const spc = $('spc'); spc.classList.toggle('cd', me.cd > 0); spc.textContent = me.cd > 0 ? Math.ceil(me.cd) : 'SP';
    const msg = $('msg');
    if (s.phase === 'story') msg.textContent = s.story ? s.story.text : '';
    else if (s.phase === 'fight') msg.textContent = me.anim === 'down' ? `Down. Back in ${me.down}…` : (s.boss ? `${s.boss.name}: ${s.boss.hp}/${s.boss.maxHp}` : '');
  }
})();
</script>
</body>
</html>
