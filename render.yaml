# Render blueprint: the game server as a free web service with a fixed https URL. Render → New → Blueprint → this repo.
# The server also serves web/, content/ and assets/, so https://save-martino.onrender.com/phone.html is the whole game.
# Free instances sleep after 15 minutes without requests and take about a minute to wake: open the watch page early.
services:
  - type: web
    name: save-martino
    runtime: node
    plan: free
    region: frankfurt # Render defaults to Oregon: from Europe that is 250 ms between a tap and the move on screen, Frankfurt is about 70
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
